name: Spring Boot CI CD Pipeline
 
on:
  push:
    branches:
      - main
 
jobs:
 
  build-test-docker:
 
    runs-on: ubuntu-latest
 
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_DATABASE: student_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
 
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/studentdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
 
    permissions:
      contents: read
 
    steps:
 
      # 1. Checkout source code
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
 
      # 2. Setup Java 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
 
      # 3. Maven Build and JUnit Testing
      - name: Maven Build and Test
        run: bash ./mvnw -B clean verify
 
      # 4. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      # 5. Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      # 6. Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/springboot-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/springboot-demo:${{ github.sha }}
